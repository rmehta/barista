name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
      - name: Run pytest
        run: |
          PYTHONPATH=. pytest barista/tests/unit -q

  docker-manager:
    name: docker-manager tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install docker-manager deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docker-manager/requirements.txt
          pip install pytest
      - name: Run pytest
        run: pytest docker-manager/tests -q

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: dashboard/yarn.lock
      - name: Install
        working-directory: dashboard
        run: |
          corepack enable
          yarn install --frozen-lockfile || yarn install
      - name: Test
        working-directory: dashboard
        run: yarn test
      - name: Build
        working-directory: dashboard
        run: yarn build

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check barista docker-manager installer install.py
